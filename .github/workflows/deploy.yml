name: Deploy to Azure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-azure-dev
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-enterprise-ai-platform-dev
  AZURE_ML_WORKSPACE: mlw-enterprise-ai-platform-dev
  AZURE_ML_MODEL_NAME: px200-failure-model
  AZURE_ML_MODEL_VERSION: "1"
  ACR_NAME: razavisraiplatform
  ACR_LOGIN_SERVER: razavisraiplatform-dqbtcxdpdwasgxb2.azurecr.io
  IMAGE_REPOSITORY: azure-enterprise-ai-platform
  CONTAINER_APP_NAME: ca-enterprise-ai-api-dev

jobs:
  deploy:
    name: Deploy container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-dev

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure ML extension
        run: az extension add --name ml --yes

      - name: Download registered Azure ML model
        run: |
          az ml model download \
            --name "$AZURE_ML_MODEL_NAME" \
            --version "$AZURE_ML_MODEL_VERSION" \
            --download-path artifacts \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --workspace-name "$AZURE_ML_WORKSPACE"

          test -f artifacts/px200-failure-model/px200_failure_model.joblib

      - name: Create immutable image name
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_URI="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Deploying image: ${IMAGE_URI}"

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build container image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag "$IMAGE_URI" \
            .

      - name: Push container image
        run: docker push "$IMAGE_URI"

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Update Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE_URI" \
            --output none

      - name: Report deployment
        run: |
          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "{Image:properties.template.containers[0].image,Revision:properties.latestRevisionName,Running:properties.runningStatus}" \
            --output table